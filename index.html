<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CI Challenge V5.1</title><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script><style>body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#0F172A,#1E3A8A,#0EA5E9);color:#fff}.container{max-width:1600px;margin:auto;padding:15px}.hero img{width:100%;height:300px;object-fit:cover;border-radius:20px}.card{background:#fff;color:#111827;border-radius:24px;padding:20px}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.home-box{background:#F3F4F6;padding:24px;border-radius:20px}.player-input{width:450px;max-width:90%;display:block;margin:15px auto;padding:14px;font-size:18px}.primary{display:block;margin:15px auto 0;padding:16px 28px;border:none;border-radius:14px;background:#FF8F1F;color:#fff;font-size:20px}.secondary{width:100%;padding:8px 12px;min-height:48px;margin-top:8px;border:none;border-radius:12px;background:#E5E7EB}.progress{height:12px;background:#EAF2FF;border-radius:20px}.bar{height:12px;background:linear-gradient(90deg,#00A3E0,#00D084)}.question-th{font-size:22px;font-weight:700}.question-en{font-size:14px;color:#666}.answer-en{font-size:13px;color:#6B7280}.timer{text-align:center;color:#E11D48;font-size:34px;font-weight:700}.score{font-size:20px;color:#00A3E0;font-weight:bold}.result-card{text-align:center}.badge-box{display:inline-block;background:#FEF3C7;color:#92400E;padding:12px 24px;border-radius:999px}.score-big{font-size:72px;color:#00A3E0;font-weight:900}.question-th{font-size:30px!important;font-weight:800!important;line-height:1.35}.question-en{font-size:18px!important;line-height:1.45;margin-top:8px}.secondary{font-size:20px!important;font-weight:700!important;line-height:1.35!important;padding:16px 18px!important;min-height:72px!important}.answer-en{font-size:16px!important;font-weight:500!important;line-height:1.35;margin-top:5px}.sound-toggle{position:fixed;right:18px;top:18px;z-index:9999;border:0;border-radius:999px;padding:10px 14px;background:rgba(15,23,42,.88);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}.urgent{color:#e11d48!important;animation:pulse .55s infinite}@keyframes pulse{50%{transform:scale(1.12)}}.game-title{display:flex;align-items:center;gap:14px;background:#17295f;color:#fff;border-radius:18px;padding:16px 22px;margin:0 0 18px;font-size:28px;font-weight:900;letter-spacing:.2px;box-shadow:0 10px 24px rgba(0,0,0,.18)}.game-title .icon{font-size:32px}.title-wide{width:100%;margin-bottom:16px;border-radius:16px;padding:17px 24px;font-size:30px}@media(max-width:640px){.game-title{font-size:24px;padding:14px 16px}}

</style></head><body><button id="soundToggle" class="sound-toggle" onclick="toggleSound()">🔊 Sound</button><audio id="applause" src="https://www.soundjay.com/human/applause-8.mp3"></audio><div id="app" class="container"></div><script>const FLOW_URL='https://default424992fe6af1421590b3fc5eb9c227.b3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/19/workflows/2bc8eff3ddac467da4101be4fd302187/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=U7hZCEHAXY3DpGHA_H01_C5lYEJ85xCvhjvjksHBTRM';const questions=[[['คุณใช้เวลา 15 นาทีทุกเช้า Download Report, Copy Excel, Paste Excel และส่ง Email ทำมาแล้ว 2 ปี คุณควรทำอะไรก่อน?','You spend 15 minutes every morning downloading a report, copying and pasting in Excel, and sending an email. You have done this for two years. What should you do first?'],[['ทำงานต่อไป เพราะเคยทำแบบนี้มาตลอด','Continue because it has always been done this way.'],['ขอคนเพิ่ม','Ask for more staff.'],['ตั้งคำถามว่างานนี้ควรทำโดยคน หรือสามารถให้ระบบทำแทนได้','Ask whether this work should be done by a person or by a system.'],['กด Ctrl+C Ctrl+V เพื่อให้ทำงานเร็วขึ้น','Press Ctrl+C and Ctrl+V faster.']],2],
[['หัวหน้าส่งอีเมลมา 5 หน้า และต้องการสรุปประเด็นสำคัญภายใน 15 นาที คุณควรเลือกวิธีใดเพื่อให้ทำงานได้ทันเวลาและมีประสิทธิภาพที่สุด?','Your manager sends a five-page email and needs the key points summarized within 15 minutes. Which method is the most efficient?'],[['อ่านเนื้อหาทีละบรรทัดแล้วสรุปเองทั้งหมด','Read every line and summarize everything manually.'],['ให้ AI ช่วยสรุปประเด็นสำคัญ แล้วตรวจสอบความถูกต้องก่อนส่งต่อ','Use AI to summarize the key points, then verify accuracy before sending.'],['พิมพ์เนื้อหาใหม่ทั้งหมดเพื่อให้เข้าใจง่ายขึ้น','Retype all content to make it easier to understand.'],['เปลี่ยนสถานะเป็นออฟไลน์เพื่อเลี่ยงการตอบกลับ','Go offline to avoid responding.']],1],
[['หากคุณต้องการปรับปรุง Process ควรเริ่มจากสิ่งใดก่อน?','If you want to improve a process, what should you do first?'],[['นำ AI มาใช้ทันที','Use AI immediately.'],['นำ Automation มาใช้ทันที','Use automation immediately.'],['เพิ่มคนเพื่อช่วยทำงาน','Add more people to support the work.'],['เข้าใจกระบวนการและปัญหาก่อน','Understand the process and problems first.']],3],
[['จากสถานการณ์จงเลือก Tool ที่เหมาะสมกับงานนี้: ทีมงานเปิด Excel เช็ค Due Date แล้วส่งอีเมลติดตามงานทีละคนทุกวัน','Choose the most suitable tool: The team opens Excel, checks due dates, and sends follow-up emails to each person every day.'],[['Lean / Redesign Process','Lean / Redesign Process'],['AI (Copilot & Cassidy)','AI (Copilot & Cassidy)'],['Power Automate','Power Automate'],['Power BI','Power BI']],2],
[['จากสถานการณ์จงเลือก Tool ที่เหมาะสมกับงานนี้: ผู้บริหารต้องการเห็นแนวโน้มงานค้าง โดยข้อมูลมีอยู่ใน Excel แต่ต้องรวมตัวเลขและทำกราฟใหม่ทุกสัปดาห์','Choose the most suitable tool: Management wants to see backlog trends from Excel data, but the figures and charts must be recreated every week.'],[['Lean / Redesign Process','Lean / Redesign Process'],['AI (Copilot & Cassidy)','AI (Copilot & Cassidy)'],['Power Automate','Power Automate'],['Power BI','Power BI']],3],
[['จากสถานการณ์จงเลือก Tool ที่เหมาะสมกับงานนี้: มีผู้อนุมัติหลายคน แต่ส่วนใหญ่ไม่เคยแก้ไขหรือให้ความเห็น ทำให้งานใช้เวลานาน','Choose the most suitable tool: There are many approvers, but most never edit or comment, which makes the process take too long.'],[['Lean / Redesign Process','Lean / Redesign Process'],['AI (Copilot & Cassidy)','AI (Copilot & Cassidy)'],['Power Automate','Power Automate'],['Power BI','Power BI']],0],
[['จากสถานการณ์จงเลือก Tool ที่เหมาะสมกับงานนี้: มีข้อมูลจำนวนมากที่ต้องอ่านและสรุปประเด็นสำคัญ โดยเป็นงานที่ทำเป็นรายครั้ง','Choose the most suitable tool: A large amount of information must be read and summarized, and this is performed on an ad hoc basis.'],[['Lean / Redesign Process','Lean / Redesign Process'],['AI (Copilot & Cassidy)','AI (Copilot & Cassidy)'],['Power Automate','Power Automate'],['Power BI','Power BI']],1],
[['จากสถานการณ์จงเลือก Tool ที่เหมาะสมกับงานนี้: รับข้อมูลจากทีม A เพื่อทำการตรวจสอบใบสมัครและเอกสารแนบก่อนส่งพิจารณา โดยต้องดึงข้อมูลกลับไปโดยอัตโนมัติ','Choose the most suitable tool: Receive information from Team A to review applications and attachments before submission, with information retrieved automatically.'],[['Lean / Redesign Process','Lean / Redesign Process'],['AI (Copilot & Cassidy)','AI (Copilot & Cassidy)'],['Power Automate','Power Automate'],['Power BI','Power BI']],1]];let p='',i=0,s=0,t=60,bst=0,st=0,tm;function badge(x){if(x>=150)return'👑 CI Grand Master';if(x>=120)return'🏆 CI Champion';if(x>=90)return'⚡ Automation Builder';if(x>=60)return'🤖 AI Explorer';return'🏭 Lean Explorer';}function home(){questionSoundActive=false;clearInterval(tm);stopMusic();app.innerHTML=`<div class='hero'><img src='LEANAI.png'></div><div class='card'><div class='game-title title-wide'><span class='icon'>🎮</span><span>Escape The Manual Work</span></div><div class='home-grid'><div class='home-box'><h2>📋 How To Play</h2><p>✅ ตอบ 8 คำถาม / Answer 8 Questions</p><p>⏱ 60 วินาทีต่อข้อ / 60 Seconds</p><p>🎯 Correct = 20 + Remaining Time</p></div><div class='home-box'><h2>🏆 Achievement Levels</h2><p>👑 CI Grand Master : 150+</p><p>🏆 CI Champion : 120-149</p><p>⚡ Automation Builder : 90-119</p><p>🤖 AI Explorer : 60-89</p><p>🏭 Lean Explorer : Below 60</p></div></div><input id='n' class='player-input' placeholder='รหัสพนักงาน / Employee ID'><button class='primary' onclick='startGame()'>🚀 Start Mission</button></div>`}let audioCtx=null,musicTimer=null,musicStep=0,soundOn=true,questionSoundActive=false;
function audioReady(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(freq,dur=.12,vol=.035,type='sine',delay=0){if(!soundOn)return;audioReady();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+dur+.03)}
function startMusic(){stopMusic();audioReady();const lead=[523.25,659.25,783.99,659.25,587.33,698.46,880,783.99],bass=[130.81,146.83,164.81,196];musicTimer=setInterval(()=>{if(!soundOn)return;const n=lead[musicStep%lead.length],bn=bass[Math.floor(musicStep/2)%bass.length];tone(n,.12,.025,'square');tone(n*2,.055,.012,'sine',.08);tone(bn,.18,.022,'triangle');if(musicStep%4===0)tone(1046.5,.04,.012,'square',.16);musicStep++},230)}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function tickSound(urgent=false){if(!questionSoundActive)return;if(urgent){tone(1450,.055,.065,'square');setTimeout(()=>tone(1850,.055,.07,'square'),95)}else{tone(920,.035,.026,'square');setTimeout(()=>tone(720,.025,.014,'square'),70)}}
function urgencySound(t){if(!questionSoundActive||t>10)return;const level=11-t;const base=980+level*95;tone(base,.055,.035+level*.004,'sawtooth');if(t<=7)setTimeout(()=>tone(base+260,.05,.04+level*.004,'square'),100);if(t<=4)setTimeout(()=>tone(base+520,.055,.055,'square'),190)}
function boomSound(){if(!soundOn)return;audioReady();const len=audioCtx.sampleRate*.65,b=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=b.getChannelData(0);for(let j=0;j<len;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/len,3);const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=180;g.gain.setValueAtTime(.38,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.65);src.buffer=b;src.connect(f).connect(g).connect(audioCtx.destination);src.start()}
function victorySound(){[523.25,659.25,783.99,1046.5].forEach((n,k)=>tone(n,.55,.055,'triangle',k*.12))}
function rainbowShower(){const layer=document.createElement('div');layer.className='rainbow-shower';document.body.appendChild(layer);const colors=['#ff6b8a','#ffb347','#ffe66d','#6ee7b7','#67d5ff','#8b9cff','#c084fc'];for(let k=0;k<95;k++){const d=document.createElement('i');d.className='rainbow-drop';d.style.left=(Math.random()*100)+'vw';d.style.background=colors[k%colors.length];d.style.setProperty('--dur',(1.8+Math.random()*2.2)+'s');d.style.setProperty('--rot',(Math.random()*180)+'deg');d.style.setProperty('--drift',((Math.random()-.5)*180)+'px');d.style.animationDelay=(Math.random()*1.1)+'s';d.style.width=(7+Math.random()*8)+'px';d.style.height=(24+Math.random()*34)+'px';layer.appendChild(d)}setTimeout(()=>layer.remove(),5200)}
function fireworks(){if(!window.confetti)return;const end=Date.now()+2800,colors=['#22d3ee','#34d399','#fbbf24','#f43f5e','#8b5cf6'];(function frame(){confetti({particleCount:7,angle:60,spread:75,origin:{x:0,y:.72},colors});confetti({particleCount:7,angle:120,spread:75,origin:{x:1,y:.72},colors});if(Date.now()<end)requestAnimationFrame(frame)})()}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'🔊 Sound':'🔇 Muted';if(soundOn){audioReady();if(i<questions.length&&p)startMusic()}else stopMusic()}
function startGame(){p=document.getElementById('n').value.trim();if(!p){alert('กรุณากรอกรหัสพนักงาน / Please enter Employee ID');return};i=0;s=0;st=0;bst=0;startMusic();showQ()}function showQ(){clearInterval(tm);questionSoundActive=true;t=60;let q=questions[i];app.innerHTML=`<div class='card'><div class='progress'><div class='bar' style='width:${(i+1)/questions.length*100}%'></div></div><h2>Question ${i+1}</h2><div class='question-th'>${q[0][0]}</div><div class='question-en'>${q[0][1]}</div><div class='score'>🏆 Score ${s}</div><div class='timer' id='tt'>⏱ ${t}</div>${q[1].map((a,x)=>`<button class='secondary' onclick='answer(${x})'><div>${a[0]}</div>${i>=3?'':`<div class='answer-en'>${a[1]}</div>`}</button>`).join('')}</div>`;tm=setInterval(()=>{t--;let e=document.getElementById('tt');if(e){e.innerHTML='⏱ '+t;e.classList.toggle('urgent',t<=10)}if(t>0&&questionSoundActive){tickSound(t<=10);if(t<=10)urgencySound(t)}if(t<=0){clearInterval(tm);questionSoundActive=false;boomSound();setTimeout(()=>next(false),450)}},1000)}function answer(x){questionSoundActive=false;clearInterval(tm);next(x===questions[i][2])}function next(ok){if(ok){st++;bst=Math.max(bst,st);s+=20+t}else st=0;i++;if(i>=questions.length)finish();else showQ()}async function finish(){questionSoundActive=false;clearInterval(tm);stopMusic();rainbowShower();fireworks();victorySound();document.getElementById('applause').play().catch(()=>{});try{await fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({EmployeeID:p,score:s,badge:badge(s)})})}catch(e){console.error('Power Automate submit failed:',e);}app.innerHTML=`<div class='card result-card'><div style='font-size:60px'>🏆</div><h1>MISSION COMPLETE</h1><div class='badge-box'>${badge(s)}</div><div class='score-big'>${s}</div><p>🔥 Best Streak ${bst}</p><button class='primary' onclick='home()'>Play Again</button></div>`}home();</script></body></html>
